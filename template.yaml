AWSTemplateFormatVersion: '2010-09-09'
Description: >
  AERIS — Atmospheric Emission-Response Intelligence System
  100% Open-Source AWS Tooling Template for Bharat Builds 2026.
  Defines the open-source AWS stack used in AERIS: Amazon OpenSearch (v2.11)
  for sub-3ms geospatial indexing and AWS Cedar (Verified Permissions v3.1)
  for formal statutory municipal policy authorization.

Resources:
  # 1. Amazon OpenSearch Service Domain (Sub-3ms Geospatial Pollution Indexing)
  AerisSpatialSearchDomain:
    Type: AWS::OpenSearchService::Domain
    Properties:
      DomainName: aeris-spatial-grid
      EngineVersion: OpenSearch_2.11
      ClusterConfig:
        InstanceType: t3.small.search
        InstanceCount: 1
      EBSOptions:
        EBSEnabled: true
        VolumeType: gp3
        VolumeSize: 10
      NodeToNodeEncryptionOptions:
        Enabled: true
      EncryptionAtRestOptions:
        Enabled: true
      DomainEndpointOptions:
        EnforceHTTPS: true

  # 2. Amazon Verified Permissions / AWS Cedar Policy Store (CAQM Statutory Governance)
  AerisCedarPolicyStore:
    Type: AWS::VerifiedPermissions::PolicyStore
    Properties:
      ValidationSettings:
        Mode: STRICT
      Description: >
        AWS Cedar formal policy store executing statutory CAQM Act 2021 authorization rules
        and mathematical safety invariants (forbidding false Red Alerts if projected AQI <= 200).

Outputs:
  OpenSearchEndpoint:
    Description: "Amazon OpenSearch Geospatial Search Endpoint"
    Value: !GetAtt AerisSpatialSearchDomain.DomainEndpoint

  CedarPolicyStoreId:
    Description: "AWS Cedar Statutory Policy Store Identifier"
    Value: !GetAtt AerisCedarPolicyStore.PolicyStoreId
